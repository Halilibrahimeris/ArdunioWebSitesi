<!--
  Project 6 — Web interface
  Arduino UNO Q · assets/index.html

  This file is served by the web server on the board's Linux side.
  Open it from any browser on the same WiFi network.

  The two scripts at the bottom (socket.io and arduino.js) ship with the
  web_ui brick — they are what open the WebSocket connection.
-->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Send Text to the LED Matrix</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>Send Text to the LED Matrix</h1>
      <p class="hint">
        Whatever you type here scrolls across the 8&times;13 LED matrix on the board.
      </p>

      <!-- Connection status -->
      <p id="connection" class="status waiting">Connecting&hellip;</p>

      <!-- Text input -->
      <label for="text">Text to display</label>
      <div class="row">
        <input
          id="text"
          type="text"
          maxlength="60"
          placeholder="For example: HELLO WORLD"
          autocomplete="off"
        />
        <button id="send">Send</button>
      </div>
      <p class="hint">
        Accented characters are folded to their plain equivalents
        (&Ccedil; &rarr; C). Lowercase becomes uppercase.
      </p>

      <!-- Brightness -->
      <label for="brightness">Brightness: <span id="brightness-value">7</span></label>
      <input id="brightness" type="range" min="0" max="7" step="1" value="7" />

      <!-- Speed -->
      <label for="speed">Scroll time: <span id="speed-value">90</span> ms/column</label>
      <input id="speed" type="range" min="20" max="400" step="10" value="90" />

      <!-- Currently showing -->
      <p class="current">
        Currently on the matrix: <strong id="current-text">&mdash;</strong>
      </p>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
  </body>
</html>
