<!--
  Proje 6 — Web arayüzü
  Arduino UNO Q · assets/index.html

  Bu dosya kartın Linux tarafındaki web sunucusu tarafından servis edilir.
  Aynı WiFi ağındaki herhangi bir tarayıcıdan açılabilir.

  Alttaki iki script (socket.io ve arduino.js) web_ui brick'i ile birlikte
  gelir — WebSocket bağlantısını onlar kuruyor.
-->
<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LED Matrise Yazı Gönder</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main>
      <h1>LED Matrise Yazı Gönder</h1>
      <p class="hint">
        Yazdığın metin kartın üzerindeki 8×13 LED matriste kayacak.
      </p>

      <!-- Bağlantı durumu -->
      <p id="baglanti" class="durum bekliyor">Bağlanıyor…</p>

      <!-- Metin girişi -->
      <label for="metin">Gösterilecek metin</label>
      <div class="satir">
        <input
          id="metin"
          type="text"
          maxlength="60"
          placeholder="Örnek: MERHABA DUNYA"
          autocomplete="off"
        />
        <button id="gonder">Gönder</button>
      </div>
      <p class="hint">
        Türkçe karakterler otomatik olarak karşılıklarına çevrilir
        (Ş → S, Ğ → G). Küçük harfler büyüğe döner.
      </p>

      <!-- Parlaklık -->
      <label for="parlaklik">Parlaklık: <span id="parlaklik-deger">7</span></label>
      <input id="parlaklik" type="range" min="0" max="7" step="1" value="7" />

      <!-- Hız -->
      <label for="hiz">Kayma süresi: <span id="hiz-deger">90</span> ms/sütun</label>
      <input id="hiz" type="range" min="20" max="400" step="10" value="90" />

      <!-- Şu an gösterilen -->
      <p class="simdiki">
        Matriste şu an: <strong id="simdiki-metin">—</strong>
      </p>
    </main>

    <script src="libs/socket.io.min.js"></script>
    <script src="libs/arduino.js"></script>
    <script src="app.js"></script>
  </body>
</html>
