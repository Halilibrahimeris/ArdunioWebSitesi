<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="d1-title">
  <title id="d1-title">Trafik lambası bağlantı şeması / Traffic light wiring diagram</title>
  <style>
    .wire   { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .w-sig  { stroke: #0d8ce0; }
    .w-pwr  { stroke: #d94a3d; }
    .w-gnd  { stroke: #6b7b80; }
    .board  { fill: var(--bg-subtle, #f6f8f9); stroke: var(--color-brand-500, #00979d); stroke-width: 2.4; }
    .part   { fill: var(--surface, #fff); stroke: var(--border, #dde4e8); stroke-width: 1.8; }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; fill: var(--text, #102b2e); }
    .lbl-b  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 13px; font-weight: 650; fill: var(--text, #102b2e); }
    .pin    { font-family: ui-monospace, monospace; font-size: 12px; font-weight: 700; fill: var(--text, #102b2e); }
    .muted  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: var(--text-faint, #83969b); }
    .pad    { fill: var(--color-brand-500, #00979d); }
  </style>

  <!-- ───────── Kart / Board ───────── -->
  <rect class="board" x="30" y="55" width="185" height="320" rx="12" />
  <text class="lbl-b" x="122" y="84" text-anchor="middle">Arduino UNO Q</text>
  <text class="muted" x="122" y="102" text-anchor="middle">3.3V logic</text>

  <!-- Header pinleri -->
  <g>
    <circle class="pad" cx="215" cy="140" r="4.5" /><text class="pin" x="196" y="144" text-anchor="end">D2</text>
    <circle class="pad" cx="215" cy="190" r="4.5" /><text class="pin" x="196" y="194" text-anchor="end">D3</text>
    <circle class="pad" cx="215" cy="240" r="4.5" /><text class="pin" x="196" y="244" text-anchor="end">D4</text>
    <circle class="pad" cx="215" cy="300" r="4.5" /><text class="pin" x="196" y="304" text-anchor="end">D7</text>
    <circle class="pad" cx="215" cy="340" r="4.5" /><text class="pin" x="196" y="344" text-anchor="end">3V3</text>
    <circle class="pad" cx="215" cy="375" r="4.5" /><text class="pin" x="196" y="379" text-anchor="end">GND</text>
  </g>

  <!-- ───────── LED satırları ───────── -->
  <!-- Kırmızı LED : D2 -->
  <path class="wire w-sig" d="M215 140 H300" />
  <rect class="part" x="300" y="128" width="58" height="24" rx="5" />
  <text class="lbl" x="329" y="145" text-anchor="middle">220Ω</text>
  <path class="wire w-sig" d="M358 140 H408" />
  <g>
    <polygon points="408,128 408,152 430,140" fill="#d94a3d" />
    <line x1="432" y1="126" x2="432" y2="154" stroke="#d94a3d" stroke-width="2.6" stroke-linecap="round" />
    <text class="lbl" x="452" y="145">Kırmızı / Red</text>
  </g>
  <path class="wire w-gnd" d="M432 140 H600 V375" />

  <!-- Sarı LED : D3 -->
  <path class="wire w-sig" d="M215 190 H300" />
  <rect class="part" x="300" y="178" width="58" height="24" rx="5" />
  <text class="lbl" x="329" y="195" text-anchor="middle">220Ω</text>
  <path class="wire w-sig" d="M358 190 H408" />
  <g>
    <polygon points="408,178 408,202 430,190" fill="#e0a91a" />
    <line x1="432" y1="176" x2="432" y2="204" stroke="#e0a91a" stroke-width="2.6" stroke-linecap="round" />
    <text class="lbl" x="452" y="195">Sarı / Yellow</text>
  </g>
  <path class="wire w-gnd" d="M432 190 H600" />

  <!-- Yeşil LED : D4 -->
  <path class="wire w-sig" d="M215 240 H300" />
  <rect class="part" x="300" y="228" width="58" height="24" rx="5" />
  <text class="lbl" x="329" y="245" text-anchor="middle">220Ω</text>
  <path class="wire w-sig" d="M358 240 H408" />
  <g>
    <polygon points="408,228 408,252 430,240" fill="#2f9e5e" />
    <line x1="432" y1="226" x2="432" y2="254" stroke="#2f9e5e" stroke-width="2.6" stroke-linecap="round" />
    <text class="lbl" x="452" y="245">Yeşil / Green</text>
  </g>
  <path class="wire w-gnd" d="M432 240 H600" />

  <!-- ───────── Buton + pull-down ───────── -->
  <!-- 3V3 -> buton -->
  <path class="wire w-pwr" d="M215 340 H260 V300 H296" />
  <rect class="part" x="296" y="286" width="92" height="28" rx="6" />
  <text class="lbl" x="342" y="305" text-anchor="middle">Buton / Button</text>

  <!-- buton -> D7 dallanması -->
  <path class="wire w-sig" d="M388 300 H452" />
  <circle cx="452" cy="300" r="4" fill="#0d8ce0" />
  <path class="wire w-sig" d="M452 300 H520 V255" />
  <text class="pin" x="528" y="252">D7</text>
  <text class="muted" x="528" y="268">signal</text>

  <!-- pull-down direnç -> GND -->
  <path class="wire w-gnd" d="M452 300 V345" />
  <rect class="part" x="423" y="345" width="58" height="24" rx="5" />
  <text class="lbl" x="452" y="362" text-anchor="middle">10kΩ</text>
  <path class="wire w-gnd" d="M452 369 V395 H600 V375" />

  <!-- GND toplayıcı -->
  <path class="wire w-gnd" d="M215 375 H600" />
  <text class="muted" x="612" y="379">GND</text>

  <!-- ───────── Açıklama ───────── -->
  <g transform="translate(30, 398)">
    <line class="wire w-pwr" x1="0" y1="6" x2="26" y2="6" />
    <text class="muted" x="32" y="10">3.3V</text>
    <line class="wire w-sig" x1="82" y1="6" x2="108" y2="6" />
    <text class="muted" x="114" y="10">signal</text>
    <line class="wire w-gnd" x1="212" y1="6" x2="238" y2="6" />
    <text class="muted" x="244" y="10">GND</text>
  </g>
</svg>
