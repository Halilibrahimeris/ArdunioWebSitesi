<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" role="img" aria-labelledby="d5-title">
  <title id="d5-title">Bridge veri akışı / Bridge data flow</title>
  <style>
    .wire   { fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round; }
    .w-sig  { stroke: #0d8ce0; }
    .w-ana  { stroke: #7c6cf5; }
    .flow   { fill: none; stroke: var(--color-brand-500, #00979d); stroke-width: 3; marker-end: url(#arrow); }
    .mcu    { fill: var(--bg-subtle, #f6f8f9); stroke: #0d8ce0; stroke-width: 2.4; }
    .mpu    { fill: var(--bg-subtle, #f6f8f9); stroke: var(--color-brand-500, #00979d); stroke-width: 2.4; }
    .part   { fill: var(--surface, #fff); stroke: var(--border, #dde4e8); stroke-width: 1.8; }
    .lbl    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 12.5px; fill: var(--text, #102b2e); }
    .lbl-b  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 14px; font-weight: 700; fill: var(--text, #102b2e); }
    .mono   { font-family: ui-monospace, monospace; font-size: 12px; fill: var(--text, #102b2e); }
    .mono-b { font-family: ui-monospace, monospace; font-size: 12.5px; font-weight: 700; fill: var(--color-brand-600, #007d83); }
    .muted  { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 11px; fill: var(--text-faint, #83969b); }
    .tag    { font-family: ui-sans-serif, system-ui, sans-serif; font-size: 10.5px; font-weight: 700; }
  </style>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="var(--color-brand-500, #00979d)" />
    </marker>
  </defs>

  <!-- ───────── Sensörler ───────── -->
  <rect class="part" x="20" y="96" width="104" height="42" rx="8" />
  <text class="lbl" x="72" y="115" text-anchor="middle">DHT11</text>
  <text class="muted" x="72" y="130" text-anchor="middle">D7</text>

  <rect class="part" x="20" y="166" width="104" height="42" rx="8" />
  <text class="lbl" x="72" y="185" text-anchor="middle">LDR</text>
  <text class="muted" x="72" y="200" text-anchor="middle">A0</text>

  <path class="wire w-sig" d="M124 117 H168" />
  <path class="wire w-ana" d="M124 187 H168" />

  <!-- ───────── MCU ───────── -->
  <rect class="mcu" x="168" y="70" width="200" height="170" rx="12" />
  <text class="tag" x="184" y="92" fill="#0d8ce0">MCU · sketch/</text>
  <text class="lbl-b" x="268" y="118" text-anchor="middle">STM32U585</text>
  <text class="muted" x="268" y="136" text-anchor="middle">pinleri okur / reads pins</text>

  <rect class="part" x="186" y="152" width="164" height="70" rx="8" />
  <text class="muted" x="268" y="171" text-anchor="middle">5 saniyede bir / every 5 s</text>
  <text class="mono-b" x="268" y="192" text-anchor="middle">Bridge.notify(</text>
  <text class="mono" x="268" y="209" text-anchor="middle">"kayit_al", …)</text>

  <!-- ───────── Bridge oku ───────── -->
  <path class="flow" d="M368 155 H432" />
  <text class="lbl-b" x="400" y="140" text-anchor="middle">Bridge</text>
  <text class="muted" x="400" y="182" text-anchor="middle">RPC</text>

  <!-- ───────── MPU ───────── -->
  <rect class="mpu" x="432" y="70" width="306" height="170" rx="12" />
  <text class="tag" x="448" y="92" fill="var(--color-brand-600, #007d83)">MPU · python/</text>
  <text class="lbl-b" x="585" y="118" text-anchor="middle">QRB2210 · Debian Linux</text>

  <rect class="part" x="450" y="140" width="270" height="82" rx="8" />
  <text class="mono-b" x="585" y="160" text-anchor="middle">Bridge.provide("kayit_al", …)</text>
  <text class="muted" x="585" y="180" text-anchor="middle">veriyi doğrular / validates the data</text>
  <text class="muted" x="585" y="198" text-anchor="middle">sonra iki yere birden yazar</text>
  <text class="muted" x="585" y="214" text-anchor="middle">then writes it to two places</text>

  <!-- ───────── Depolama ───────── -->
  <path class="flow" d="M520 240 V286" />
  <path class="flow" d="M650 240 V286" />

  <rect class="part" x="428" y="286" width="184" height="72" rx="10" />
  <text class="lbl-b" x="520" y="310" text-anchor="middle">TimeSeriesStore</text>
  <text class="muted" x="520" y="328" text-anchor="middle">dbstorage_tsstore brick</text>
  <text class="muted" x="520" y="345" text-anchor="middle">sorgulanabilir / queryable</text>

  <rect class="part" x="632" y="286" width="112" height="72" rx="10" />
  <text class="lbl-b" x="688" y="310" text-anchor="middle">CSV</text>
  <text class="muted" x="688" y="328" text-anchor="middle">olcumler.csv</text>
  <text class="muted" x="688" y="345" text-anchor="middle">Excel'de açılır</text>

  <!-- İş bölümü notu -->
  <g transform="translate(20, 258)">
    <rect class="part" x="0" y="0" width="380" height="100" rx="10" />
    <text class="lbl-b" x="16" y="24">İş bölümü / Division of labour</text>
    <text class="muted" x="16" y="46">MCU: tam zamanında ölçer, hiçbir şey saklamaz</text>
    <text class="muted" x="16" y="62">MCU measures on time, stores nothing</text>
    <text class="muted" x="16" y="82">MPU: dosya sistemi ve veritabanı burada</text>
  </g>

  <!-- Alt açıklama -->
  <text class="muted" x="380" y="392" text-anchor="middle">
    İki taraftaki fonksiyon adı BİREBİR aynı olmalı / the function name must match EXACTLY on both sides
  </text>
  <text class="muted" x="380" y="410" text-anchor="middle">
    notify() cevap beklemez — veriyi gönderir ve devam eder / notify() does not wait for a reply
  </text>
</svg>
